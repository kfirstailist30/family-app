<!DOCTYPE html> 
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב משפחתי בזמן אמת</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #map { width: 100%; height: 80vh; }
    #controls { padding: 10px; height: 20vh; background: #f0f0f0; }
    select, button { font-size: 16px; padding: 10px; margin: 5px 0; width: 100%; }
    button { background: #28a745; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>

<div id="controls">
  <label for="userName">מי משתמש בטלפון הזה?</label>
  <select id="userName">
    <option value="כפיר">כפיר</option>
    <option value="מירי">מירי</option>
    <option value="רונילי">רונילי</option>
  </select>
  <button onclick="startTracking()">התחל שיתוף מיקום חי</button>
</div>

<div id="map"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://family-tracker-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.0461, 34.8516], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  const markers = {};

  const usersRef = ref(db, 'locations');
  onValue(usersRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      Object.keys(data).forEach(user => {
        const { lat, lng } = data[user];
        if (markers[user]) {
          markers[user].setLatLng([lat, lng]);
        } else {
          markers[user] = L.marker([lat, lng]).addTo(map).bindPopup(user).openPopup();
        }
      });
    }
  });

  window.startTracking = function() {
    const userName = document.getElementById('userName').value;
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        set(ref(db, 'locations/' + userName), {
          lat: lat,
          lng: lng,
          timestamp: Date.now()
        });
      }, (error) => {
        alert("שגיאה בקבלת מיקום: " + error.message);
      }, {
        enableHighAccuracy: true
      });
    } else {
      alert("הדפדפן שלך לא תומך במיקום GPS");
    }
  };
</script>

</body>
</html>
