<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב לייב בזמן אמת</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; }
        .controls { padding: 12px; background: #1e1e1e; color: white; text-align: center; }
        input, select { padding: 10px; width: 40%; font-size: 15px; border-radius: 6px; border: 1px solid #444; text-align: center; margin: 4px; }
        button { padding: 12px; width: 90%; max-width: 320px; font-size: 16px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 6px; }
        #status { margin-top: 8px; font-size: 14px; font-weight: bold; color: #ffc107; }
        .user-marker { font-size: 28px; text-align: center; line-height: 1.1; text-shadow: 0 0 5px #fff; white-space: nowrap; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <input type="text" id="username" placeholder="הכנס שם">
    <select id="mode">
        <option value="🚗">🚗 מכונית</option>
        <option value="🚶">🚶 הליכה</option>
        <option value="🏍️">🏍️ אופנוע</option>
        <option value="🏎️">🏎️ באגי/טרקטורון</option>
    </select>
    <br>
    <button id="start-btn">התחל שיתוף בלייב 🔴</button>
    <div id="status">ממתין להפעלת GPS...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    authDomain: "family-tracker-79ffd.firebaseapp.com",
    databaseURL: "https://family-tracker-79ffd-default-rtdb.firebaseio.com",
    projectId: "family-tracker-79ffd",
    storageBucket: "family-tracker-79ffd.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:family-tracking"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.5, 34.75], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  let markers = {};
  let myName = "";
  let firstFix = true;

  function createIcon(symbol, label) {
    return L.divIcon({
      html: `<div class="user-marker">${symbol}<br><span style="font-size:11px; background:rgba(0,0,0,0.85); color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${label}</span></div>`,
      className: '',
      iconSize: [50, 50],
      iconAnchor: [25, 25]
    });
  }

  // האזנה בזמן אמת לכל המשתמשים ב-Firebase
  const locationsRef = ref(db, 'locations');
  onValue(locationsRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    Object.keys(data).forEach((userKey) => {
      const user = data[userKey];
      if (!user.lat || !user.lng) return;

      const latLng = [user.lat, user.lng];
      const symbol = user.mode || '📍';
      const label = user.name || userKey;

      if (markers[userKey]) {
        // עדכון מיקום ואייקון של מרקר קיים
        markers[userKey].setLatLng(latLng);
        markers[userKey].setIcon(createIcon(symbol, label));
      } else {
        // יצירת מרקר חדש למשתמש
        markers[userKey] = L.marker(latLng, { icon: createIcon(symbol, label) }).addTo(map);
      }

      // התמקדות ראשונית במיקום שלי
      if (userKey === myName && firstFix) {
        map.setView(latLng, 16);
        firstFix = false;
      }
    });
  });

  // לחיצה על כפתור התחלת שיתוף
  document.getElementById('start-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('username').value.trim();
    const modeInput = document.getElementById('mode').value;

    if (!nameInput) {
      alert('נא להזין שם לפני התחלת השיתוף');
      return;
    }

    myName = nameInput;
    document.getElementById('status').innerText = 'משדר לייב פעיל עבור: ' + myName;
    document.getElementById('start-btn').style.background = '#dc3545';
    document.getElementById('start-btn').innerText = 'משדר בשידור חי... 📡';

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        // שליחת המיקום המעודכן ל-Firebase
        set(ref(db, 'locations/' + myName), {
          name: myName,
          mode: modeInput,
          lat: lat,
          lng: lng,
          timestamp: Date.now()
        });
      }, (err) => {
        document.getElementById('status').innerText = 'שגיאת GPS: ' + err.message;
      }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      });
    } else {
      alert('הדפדפן שלך אינו תומך ברכיב GPS');
    }
  });
</script>
</body>
</html>
