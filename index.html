<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב משפחתי בזמן אמת</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 80vh; width: 100vw; }
    #controls { height: 20vh; padding: 10px; box-sizing: border-box; text-align: center; background: #f8f9fa; }
    select, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="controls">
    <label for="userName">מי משתמש בטלפון הזה?</label><br>
    <select id="userName">
      <select id="userName">
  <option value="כפיר">כפיר</option>
  <option value="מירי">מירי</option>
  <option value="רונילי">רונילי</option>
      </select>
    
    </select>
    <br>
    <button onclick="startTracking()">התחל שיתוף מיקום חי</button>
  </div>

  <div id="map"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBR32AHPMIr52u-E28IeF8R-e2i5Z-x8i0",
      authDomain: "family-tracker-79ffd.firebaseapp.com",
      projectId: "family-tracker-79ffd",
      storageBucket: "family-tracker-79ffd.firebasestorage.app",
      messagingSenderId: "24834490381",
      appId: "1:24834490381:web:2009bf6fef386d64",
      measurementId: "G-EJD7F75DBJ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const map = L.map('map').setView([31.0461, 34.8516], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = {};

    window.startTracking = function() {
      const name = document.getElementById('userName').value;
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          
          set(ref(database, 'locations/' + name), {
            lat: lat,
            lng: lng,
            time: new Date().toLocaleTimeString()
          });
        }, (err) => alert("יש לאשר גישה ל-GPS בטלפון"), { enableHighAccuracy: true });
      }
    };

    onValue(ref(database, 'locations'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      Object.keys(data).forEach((user) => {
        const { lat, lng } = data[user];
        if (markers[user]) {
          markers[user].setLatLng([lat, lng]);
        } else {
          markers[user] = L.marker([lat, lng]).addTo(map).bindPopup(user).openPopup();
        }
      });
    });
  </script>
</body>
</html>
