<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת ניווט ושטח Pro - כפיר</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: white; }
        
        #map { height: 68vh; width: 100%; z-index: 1; transition: filter 0.3s ease; }
        .dark-map { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .controls { height: 32vh; background: #1e1e1e; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; border-top: 2px solid #333; }
        
        .input-row { display: flex; gap: 6px; }
        input, select { flex: 1; padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; text-align: center; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { padding: 9px 2px; font-size: 11px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2px; }
        #start-btn { background: #28a745; }
        #record-btn { background: #ff9800; }
        #sos-btn { background: #dc3545; animation: pulse 1.5s infinite; }
        #poi-btn { background: #9c27b0; }
        #center-btn { background: #17a2b8; }
        #history-btn { background: #0288d1; }
        #night-btn { background: #343a40; }
        #wa-btn { background: #25d366; }
        #speed-alert-btn { background: #d32f2f; }
        
        #dash-info { display: flex; justify-content: space-around; background: #2a2a2a; padding: 6px; border-radius: 6px; font-size: 12px; color: #00e676; font-weight: bold; }
        #status { font-size: 11px; text-align: center; color: #ffc107; }
        
        .footer { font-size: 10px; text-align: center; color: #777; }

        /* עיצוב אייקונים על המפה */
        .custom-marker { text-align: center; white-space: nowrap; }
        .marker-icon { font-size: 26px; line-height: 1; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); }
        .marker-card { background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid #555; display: inline-block; margin-top: 2px; }
        
        .waze-arrow-container { width: 30px; height: 30px; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease-out; }
        .waze-arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 20px solid #00d2ff; filter: drop-shadow(0px 0px 4px rgba(0,0,0,0.8)); }
        .sos-marker { background: #dc3545; color: white; padding: 4px 8px; border-radius: 8px; font-weight: bold; font-size: 11px; border: 2px solid white; box-shadow: 0 0 8px red; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <div class="input-row">
        <input type="text" id="username" placeholder="שם הנהג/ת">
        <select id="mode">
            <option value="navigation">🧭 ניווט כביש (חץ)</option>
            <option value="🏎️">🏎️ טרקטורון / באגי</option>
            <option value="🏍️">🏍️ אופנוע</option>
            <option value="🚗">🚗 מכונית</option>
            <option value="🚶">🚶 הליכה</option>
        </select>
    </div>

    <div class="btn-grid">
        <button id="start-btn">לייב 🔴</button>
        <button id="record-btn">הקלטה ⏺️</button>
        <button id="sos-btn">SOS 🆘</button>
        <button id="poi-btn">נקודה 📍</button>
        <button id="center-btn">מיקוד 🎯</button>
        <button id="history-btn">היסטוריה 📅</button>
        <button id="night-btn">לילה 🌙</button>
        <button id="wa-btn">שתף 💬</button>
    </div>

    <div id="dash-info">
        <span id="speed-display">🚀 0 קמ"ש</span>
        <span id="alt-display">🏔️ 0 מטר</span>
        <span id="batt-display">🔋 סוללה: -</span>
        <button id="speed-alert-btn" style="padding: 2px 6px; font-size: 10px;">🔊 80+</button>
    </div>

    <div id="status">ממתין להפעלת GPS...</div>
    <div class="footer">פותח ע"י כפיר | מערכת ניווט ושטח Pro © 2026</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    authDomain: "family-tracker-79ffd.firebaseapp.com",
    databaseURL: "https://family-tracker-79ffd-default-rtdb.firebaseio.com",
    projectId: "family-tracker-79ffd",
    storageBucket: "family-tracker-79ffd.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:family-tracking"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 1. הגדרת מפות: כביש, שטח טופוגרפי ולוויין איכותי
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });

  const map = L.map('map', { layers: [streets] }).setView([31.5, 34.75], 8);
  L.control.layers({ "🗺️ כבישים": streets, "🏔️ שטח טופוגרפי": topo, "🛰️ לוויין": satellite }).addTo(map);

  let markers = {};
  let myName = localStorage.getItem('tracker_username') || "";
  let autoCenter = true;
  let batteryLevel = null;
  let currentLat = null, currentLng = null;
  let speedAlertActive = false;
  let isDarkMode = false;

  if (myName) document.getElementById('username').value = myName;

  if ('getBattery' in navigator) {
    navigator.getBattery().then((battery) => {
      batteryLevel = Math.round(battery.level * 100);
      battery.addEventListener('levelchange', () => batteryLevel = Math.round(battery.level * 100));
    });
  }

  map.on('dragstart', () => { autoCenter = false; });

  // 2. מצב לילה למפה
  document.getElementById('night-btn').addEventListener('click', () => {
    isDarkMode = !isDarkMode;
    const mapElement = document.getElementById('map');
    if (isDarkMode) {
      mapElement.classList.add('dark-map');
      document.getElementById('night-btn').innerText = 'יום ☀️';
    } else {
      mapElement.classList.remove('dark-map');
      document.getElementById('night-btn').innerText = 'לילה 🌙';
    }
  });

  // 3. התראת מהירות
  document.getElementById('speed-alert-btn').addEventListener('click', () => {
    speedAlertActive = !speedAlertActive;
    const btn = document.getElementById('speed-alert-btn');
    if (speedAlertActive) {
      btn.style.background = '#28a745';
      btn.innerText = '🔊 פעיל';
      alert('התראת מהירות מופעלת מעל 80 קמ"ש');
    } else {
      btn.style.background = '#d32f2f';
      btn.innerText = '🔊 80+';
    }
  });

  // 4. שיתוף וואטסאפ מהיר
  document.getElementById('wa-btn').addEventListener('click', () => {
    if (!currentLat || !currentLng) return alert('עדיין אין מיקום GPS זמין לשיתוף');
    const mapsUrl = `https://maps.google.com/?q=${currentLat},${currentLng}`;
    const text = `היי, זה המיקום הנוכחי שלי בשטח: ${mapsUrl}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  });

  function playSpeedWarning() {
    if ('speechSynthesis' in window) {
      const msg = new SpeechSynthesisUtterance('זהירות, מהירות מופרזת');
      msg.lang = 'he-IL';
      window.speechSynthesis.speak(msg);
    }
  }

  function createIcon(mode, label, heading, isSos) {
    if (isSos) {
      return L.divIcon({
        html: `<div class="sos-marker">🆘 SOS! ${label}</div>`,
        className: 'custom-marker',
        iconSize: [100, 30],
        iconAnchor: [50, 15]
      });
    }

    let iconHtml = "";
    if (mode === 'navigation') {
      iconHtml = `<div class="waze-arrow-container" style="transform: rotate(${heading || 0}deg);"><div class="waze-arrow"></div></div>`;
    } else {
      iconHtml = `<div class="marker-icon">${mode}</div>`;
    }

    return L.divIcon({
      html: `<div class="custom-marker">${iconHtml}<div class="marker-card">${label}</div></div>`,
      className: 'custom-marker',
      iconSize: [60, 50],
      iconAnchor: [30, 25]
    });
  }

  onValue(ref(db, 'locations'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    Object.keys(data).forEach((userKey) => {
      const user = data[userKey];
      if (!user.lat || !user.lng) return;

      const latLng = [user.lat, user.lng];
      const mode = user.mode || 'navigation';
      const label = user.name || userKey;

      if (markers[userKey]) {
        markers[userKey].setLatLng(latLng);
        markers[userKey].setIcon(createIcon(mode, label, user.heading, user.sos));
      } else {
        markers[userKey] = L.marker(latLng, { icon: createIcon(mode, label, user.heading, user.sos) }).addTo(map);
      }

      if (userKey === myName) {
        document.getElementById('speed-display').innerText = `🚀 ${user.speed || 0} קמ"ש`;
        document.getElementById('alt-display').innerText = `🏔️ ${user.altitude || 0} מטר`;
        document.getElementById('batt-display').innerText = `🔋 ${user.battery || '-'}%`;

        if (speedAlertActive && user.speed > 80) {
          playSpeedWarning();
        }

        if (autoCenter) {
          map.panTo(latLng, { animate: true, duration: 0.5 });
          if (map.getZoom() < 15) map.setZoom(15);
        }
      }
    });
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('username').value.trim();
    const modeInput = document.getElementById('mode').value;

    if (!nameInput) return alert('נא להזין שם');

    myName = nameInput;
    autoCenter = true;
    localStorage.setItem('tracker_username', myName);

    document.getElementById('status').innerText = 'משדר לייב פעיל... 📡';
    document.getElementById('start-btn').style.background = '#dc3545';
    document.getElementById('start-btn').innerText = 'משדר...';

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        const alt = pos.coords.altitude ? Math.round(pos.coords.altitude) : 0;
        const heading = pos.coords.heading || 0;

        set(ref(db, 'locations/' + myName), {
          name: myName,
          mode: modeInput,
          lat: currentLat,
          lng: currentLng,
          speed: speedKmh,
          altitude: alt,
          heading: heading,
          battery: batteryLevel,
          timestamp: Date.now()
        });
      }, (err) => {
        document.getElementById('status').innerText = 'שגיאת GPS: ' + err.message;
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    }
  });

  document.getElementById('center-btn').addEventListener('click', () => {
    autoCenter = true;
    if (myName && markers[myName]) {
      map.setView(markers[myName].getLatLng(), 16, { animate: true });
    }
  });

  document.getElementById('sos-btn').addEventListener('click', () => {
    if (!myName) return alert('התחל שיתוף בלייב תחילה');
    const confirmSos = confirm("האם לשלוח התראת מצוקה SOS?");
    if (confirmSos) {
      set(ref(db, `locations/${myName}/sos`), true);
    }
  });
</script>
</body>
</html>
