<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב לייב משפחתי - סגנון Waze</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; }
        .controls { padding: 10px; background: #1e1e1e; color: white; text-align: center; }
        input, select { padding: 8px; width: 42%; font-size: 14px; border-radius: 6px; border: 1px solid #444; text-align: center; margin: 3px; }
        .btn-group { display: flex; justify-content: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        button { padding: 10px 14px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #start-btn { background: #28a745; }
        #record-btn { background: #ff9800; }
        #history-btn { background: #0288d1; }
        #center-btn { background: #17a2b8; }
        #status { margin-top: 6px; font-size: 13px; font-weight: bold; color: #ffc107; }
        #distance-info { margin-top: 4px; font-size: 12px; color: #00e676; font-weight: bold; }
        
        /* עיצוב חץ Waze מסתובב */
        .waze-arrow-container {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease-out;
        }
        .waze-arrow {
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 24px solid #00d2ff;
            filter: drop-shadow(0px 0px 4px rgba(0,0,0,0.6));
        }
        .marker-card { 
            background: rgba(0,0,0,0.85); 
            color: white; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
            white-space: nowrap; 
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <div>
        <input type="text" id="username" placeholder="הכנס שם">
        <select id="mode">
            <option value="navigation">🧭 Waze חץ ניווט</option>
            <option value="🚗">🚗 מכונית</option>
            <option value="🚶">🚶 הליכה</option>
            <option value="🏍️">🏍️ אופנוע</option>
            <option value="🏎️">🏎️ טרקטורון/באגי</option>
        </select>
    </div>
    
    <div class="btn-group">
        <button id="start-btn">שיתוף לייב 🔴</button>
        <button id="record-btn">התחל הקלטה ⏺️</button>
        <button id="center-btn">מיקום שלי 🎯</button>
    </div>

    <div style="margin-top: 6px;">
        <input type="date" id="history-date">
        <button id="history-btn">היסטוריה 📅</button>
    </div>

    <div id="status">ממתין להפעלת GPS...</div>
    <div id="distance-info"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    authDomain: "family-tracker-79ffd.firebaseapp.com",
    databaseURL: "https://family-tracker-79ffd-default-rtdb.firebaseio.com",
    projectId: "family-tracker-79ffd",
    storageBucket: "family-tracker-79ffd.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:family-tracking"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.5, 34.75], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  let markers = {};
  let usersData = {};
  let myName = "";
  let autoCenter = true;
  let batteryLevel = null;
  let isRecording = false;
  let currentPolyline = null;
  let historyPolyline = null;
  let recordedPoints = [];

  const todayStr = new Date().toISOString().split('T')[0];
  document.getElementById('history-date').value = todayStr;

  const savedName = localStorage.getItem('tracker_username');
  const savedMode = localStorage.getItem('tracker_mode');
  if (savedName) document.getElementById('username').value = savedName;
  if (savedMode) document.getElementById('mode').value = savedMode;

  if ('getBattery' in navigator) {
    navigator.getBattery().then((battery) => {
      batteryLevel = Math.round(battery.level * 100);
      battery.addEventListener('levelchange', () => batteryLevel = Math.round(battery.level * 100));
    });
  }

  // הפסקת מעקב אוטומטי אם המשתמש מזיז את המפה ידנית
  map.on('dragstart', () => { autoCenter = false; });

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
  }

  // יצירת אייקון Waze או אייקון רגיל
  function createIcon(mode, label, battery, speed, heading) {
    const batteryText = battery ? ` | 🔋${battery}%` : '';
    const speedText = speed && speed > 0 ? ` | 🚀${Math.round(speed)} קמ"ש` : '';
    const headingAngle = heading || 0;

    let iconContent = mode;
    if (mode === 'navigation') {
      iconContent = `<div class="waze-arrow-container" style="transform: rotate(${headingAngle}deg);"><div class="waze-arrow"></div></div>`;
    } else {
      iconContent = `<div style="font-size:28px;">${mode}</div>`;
    }

    return L.divIcon({
      html: `<div style="text-align:center;">${iconContent}<div class="marker-card">${label}${batteryText}${speedText}</div></div>`,
      className: '',
      iconSize: [60, 60],
      iconAnchor: [30, 30]
    });
  }

  // האזנה בלייב ל-Firebase
  onValue(ref(db, 'locations'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    usersData = data;
    Object.keys(data).forEach((userKey) => {
      const user = data[userKey];
      if (!user.lat || !user.lng) return;

      const latLng = [user.lat, user.lng];
      const mode = user.mode || 'navigation';
      const label = user.name || userKey;

      if (markers[userKey]) {
        markers[userKey].setLatLng(latLng);
        markers[userKey].setIcon(createIcon(mode, label, user.battery, user.speed, user.heading));
      } else {
        markers[userKey] = L.marker(latLng, { icon: createIcon(mode, label, user.battery, user.speed, user.heading) }).addTo(map);
      }

      // מרכז מפה אוטומטי בנסיעה
      if (userKey === myName && autoCenter) {
        map.panTo(latLng, { animate: true, duration: 0.8 });
        if (map.getZoom() < 16) map.setZoom(16);
      }
    });

    if (myName && usersData[myName]) {
      const otherKeys = Object.keys(usersData).filter(k => k !== myName);
      if (otherKeys.length > 0) {
        const otherUser = usersData[otherKeys[0]];
        const dist = calculateDistance(usersData[myName].lat, usersData[myName].lng, otherUser.lat, otherUser.lng);
        document.getElementById('distance-info').innerText = `מרחק מ-${otherUser.name}: ${dist} ק"מ`;
      }
    }
  });

  // התחלת שידור
  document.getElementById('start-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('username').value.trim();
    const modeInput = document.getElementById('mode').value;

    if (!nameInput) return alert('נא להזין שם');

    myName = nameInput;
    autoCenter = true;
    localStorage.setItem('tracker_username', myName);
    localStorage.setItem('tracker_mode', modeInput);

    document.getElementById('status').innerText = 'משדר לייב פעיל עבור: ' + myName;
    document.getElementById('start-btn').style.background = '#dc3545';
    document.getElementById('start-btn').innerText = 'משדר... 📡';

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const speedKmh = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
        const heading = pos.coords.heading || 0; // זווית כיוון הנסיעה מ-GPS

        set(ref(db, 'locations/' + myName), {
          name: myName,
          mode: modeInput,
          lat: lat,
          lng: lng,
          speed: speedKmh,
          heading: heading,
          battery: batteryLevel,
          timestamp: Date.now()
        });

        if (isRecording) {
          const point = [lat, lng];
          recordedPoints.push(point);
          if (!currentPolyline) {
            currentPolyline = L.polyline(recordedPoints, { color: '#ff3388', weight: 5 }).addTo(map);
          } else {
            currentPolyline.setLatLngs(recordedPoints);
          }

          push(ref(db, `history/${todayStr}/${myName}`), {
            lat: lat,
            lng: lng,
            timestamp: Date.now()
          });
        }
      }, (err) => {
        document.getElementById('status').innerText = 'שגיאת GPS: ' + err.message;
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    }
  });

  // כפתור התמקדות מחדש
  document.getElementById('center-btn').addEventListener('click', () => {
    autoCenter = true;
    if (myName && usersData[myName]) {
      map.setView([usersData[myName].lat, usersData[myName].lng], 17, { animate: true });
    }
  });

  // כפתור הקלטה
  document.getElementById('record-btn').addEventListener('click', () => {
    if (!myName) return alert('התחל שיתוף בלייב לפני ההקלטה');

    isRecording = !isRecording;
    const btn = document.getElementById('record-btn');

    if (isRecording) {
      btn.style.background = '#dc3545';
      btn.innerText = 'עצור הקלטה ⏹️';
      recordedPoints = [];
      document.getElementById('status').innerText = 'מקליט מסלול בזמן אמת... 🔴';
    } else {
      btn.style.background = '#ff9800';
      btn.innerText = 'התחל הקלטה ⏺️';
      document.getElementById('status').innerText = 'ההקלטה נשמרה בהצלחה! 💾';
    }
  });

  // הצגת היסטוריה
  document.getElementById('history-btn').addEventListener('click', () => {
    const selectedDate = document.getElementById('history-date').value;
    const nameInput = document.getElementById('username').value.trim() || myName;

    if (!selectedDate || !nameInput) return alert('יש לבחור שם ותאריך');

    get(ref(db, `history/${selectedDate}/${nameInput}`)).then((snapshot) => {
      const data = snapshot.val();
      if (!data) return alert('לא נמצאו מסלולים בתאריך זה');

      const path = Object.values(data).map(pt => [pt.lat, pt.lng]);
      if (historyPolyline) map.removeLayer(historyPolyline);

      historyPolyline = L.polyline(path, { color: '#007bff', weight: 6, dashArray: '8, 8' }).addTo(map);
      map.fitBounds(historyPolyline.getBounds());
      document.getElementById('status').innerText = `מוצג מסלול מוקלט מתאריך ${selectedDate}`;
    });
  });
</script>
</body>
</html>
