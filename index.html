<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפה משפחתית</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; text-align: center; background: #f4f4f9; }
        #controls { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin-bottom: 10px; }
        select, button { width: 100%; padding: 12px; margin: 5px 0; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; }
        select { border: 1px solid #ccc; background: #fff; }
        .btn-green { background: #28a745; color: white; }
        .btn-blue { background: #007bff; color: white; }
        .btn-red { background: #dc3545; color: white; }
        #map { height: 60vh; width: 100%; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="controls">
    <label for="userSelect"><b>מי משתמש בטלפון הזה?</b></label>
    <select id="userSelect">
        <option value="כפיר">כפיר</option>
        <option value="מירי">מירי</option>
        <option value="רונילי">רונילי</option>
    </select>

    <button class="btn-green" onclick="startSharing()">התחל שיתוף מיקום חי</button>
    <button class="btn-blue" onclick="showAllOnMap()">הצג את כולם על המפה</button>
    <button class="btn-red" onclick="resetTracks()">איפוס היסטוריית מסלולים</button>
</div>

<div id="map"></div>

<script>
    const map = L.map('map').setView([31.5, 34.75], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker = null;

    function startSharing() {
        const selectedUser = document.getElementById('userSelect').value;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng]).addTo(map)
                            .bindPopup(`<b>${selectedUser}</b><br>אני כאן!`)
                            .openPopup();
                    }
                    map.setView([lat, lng], 15);
                },
                (error) => {
                    alert("שגיאה בקבלת מיקום: " + error.message);
                },
                { enableHighAccuracy: true }
            );
        } else {
            alert("הדפדפן אינו תומך בשיתוף מיקום.");
        }
    }

    function showAllOnMap() {
        if (userMarker) {
            map.setView(userMarker.getLatLng(), 15);
        } else {
            alert("עדיין לא הופעל שיתוף מיקום בטלפון הזה.");
        }
    }

    function resetTracks() {
        if (confirm("האם אתה בטוח שברצונך לאפס את כל המסלולים?")) {
            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }
            alert("היסטוריית המסלולים ואופסה בהצלחה!");
        }
    }
</script>

</body>
</html>
