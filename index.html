<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב לייב בזמן אמת</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; }
        .controls { padding: 12px; background: #1e1e1e; color: white; text-align: center; }
        input, select { padding: 10px; width: 42%; font-size: 15px; border-radius: 6px; border: 1px solid #444; text-align: center; margin: 4px; }
        button { padding: 12px; width: 90%; max-width: 320px; font-size: 16px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 6px; }
        #status { margin-top: 8px; font-size: 14px; font-weight: bold; color: #ffc107; }
        .user-marker { font-size: 26px; text-align: center; line-height: 20px; text-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <input type="text" id="username" placeholder="הכנס שם">
    <select id="mode">
        <option value="🚗">🚗 מכונית</option>
        <option value="🚶">🚶 הליכה</option>
    </select>
    <br>
    <button id="start-btn">התחל שיתוף בלייב 🔴</button>
    <div id="status">ממתין להפעלת GPS...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    authDomain: "family-tracking.firebaseapp.com",
    databaseURL: "https://family-tracking.firebaseio.com",
    projectId: "family-tracking",
    storageBucket: "family-tracking.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:family-tracking"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.5, 34.75], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  let markers = {};
  let paths = {};
  let myName = "";
  let firstFix = false;

  function createIcon(symbol, label) {
    return L.divIcon({
      html: `<div class="user-marker">${symbol}<br><span style="font-size:11px; background:rgba(0,0,0,0.8); color:white; padding:2px 6px; border-radius:4px; font-family:sans-serif;">${label}</span></div>`,
      className: '',
      iconSize: [60, 60],
      iconAnchor: [30, 30]
    });
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    myName = document.getElementById('username').value.trim();
    const mode = document.getElementById('mode').value;
    if (!myName) return alert('נא להזין שם לפני ההפעלה');

    document.getElementById('status').innerText = "🔴 משדר לייב פעיל עבור: " + myName;

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        if (!firstFix) {
          map.setView([lat, lng], 16);
          firstFix = true;
        } else {
          map.panTo([lat, lng]);
        }

        set(ref(db, 'users/' + myName + '/last'), {
          name: myName,
          lat: lat,
          lng: lng,
          mode: mode,
          time: Date.now()
        });

        push(ref(db, 'users/' + myName + '/path'), { lat, lng, time: Date.now() });

      }, (err) => {
        document.getElementById('status').innerText = "❌ שגיאת GPS: נא לאשר מיקום בטלפון";
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }
  });

  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    if (!users) return;

    Object.keys(users).forEach((uName) => {
      const uData = users[uName];

      if (uData.last && uData.last.lat && uData.last.lng) {
        const lat = uData.last.lat;
        const lng = uData.last.lng;
        const mode = uData.last.mode || '📍';

        if (markers[uName]) {
          markers[uName].setLatLng([lat, lng]);
          markers[uName].setIcon(createIcon(mode, uName));
        } else {
          markers[uName] = L.marker([lat, lng], { icon: createIcon(mode, uName) }).addTo(map);
        }
      }

      if (uData.path) {
        const pts = Object.values(uData.path).map(p => [p.lat, p.lng]);
        if (paths[uName]) {
          paths[uName].setLatLngs(pts);
        } else {
          const color = (uName === myName) ? '#0066ff' : '#ff0055';
          paths[uName] = L.polyline(pts, { color: color, weight: 5 }).addTo(map);
        }
      }
    });
  });
</script>
</body>
</html>
