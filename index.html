<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת שטח Pro | כפיר</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        /* המפה תתפוס את כל הגובה פחות לוח הבקרה */
        #map { height: 75vh; width: 100%; }
        .controls { height: 25vh; background: #121212; color: white; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        button { padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        
        #dash-info { display: flex; justify-content: space-between; background: #333; padding: 5px; border-radius: 4px; font-size: 12px; margin: 5px 0; }
        
        /* איקון משתמש */
        .marker-box { text-align: center; font-weight: bold; }
        .marker-label { background: rgba(0,0,0,0.7); color: white; padding: 2px 4px; border-radius: 3px; font-size: 10px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <div style="display: flex; gap: 5px;">
        <input type="text" id="username" placeholder="שם הנהג" style="flex:1; padding:5px;">
        <select id="mode" style="flex:1;">
            <option value="navigation">כביש</option>
            <option value="🏎️">שטח</option>
        </select>
    </div>

    <div class="btn-grid">
        <button id="start-btn" style="background:#2e7d32">לייב 🔴</button>
        <button id="record-btn" style="background:#ef6c00">הקלטה ⏺️</button>
        <button id="sos-btn" style="background:#c62828">SOS 🆘</button>
        <button id="poi-btn" style="background:#6a1b9a">נקודה 📍</button>
        <button id="center-btn" style="background:#0277bd">מיקוד 🎯</button>
        <button id="history-btn" style="background:#37474f">היסטוריה 📅</button>
    </div>

    <div id="dash-info">
        <span id="speed-display">🚀 0 קמ"ש</span>
        <span id="alt-display">🏔️ 0 מ'</span>
        <span id="batt-display">🔋 -</span>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const app = initializeApp({ databaseURL: "https://family-tracker-79ffd-default-rtdb.firebaseio.com" });
  const db = getDatabase(app);
  
  // הגדרת מפות: כביש ושטח
  const mapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
  const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
  const map = L.map('map', { layers: [mapLayer] }).setView([31.5, 34.75], 8);
  
  L.control.layers({ "כביש": mapLayer, "שטח": topoLayer }).addTo(map);

  let markers = {};
  let myName = localStorage.getItem('tracker_username') || "";
  document.getElementById('username').value = myName;

  onValue(ref(db, 'locations'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    
    Object.keys(data).forEach(uKey => {
      const u = data[uKey];
      const icon = L.divIcon({ html: `<div class="marker-box">📍<div class="marker-label">${u.name}</div></div>`, iconSize: [40, 40] });
      
      if (markers[uKey]) {
        markers[uKey].setLatLng([u.lat, u.lng]);
      } else {
        markers[uKey] = L.marker([u.lat, u.lng], { icon }).addTo(map);
      }
      
      if (uKey === myName) {
        document.getElementById('speed-display').innerText = `🚀 ${u.speed || 0} קמ"ש`;
        document.getElementById('alt-display').innerText = `🏔️ ${u.altitude || 0} מ'`;
        document.getElementById('batt-display').innerText = `🔋 ${u.battery || 0}%`;
      }
    });
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    myName = document.getElementById('username').value.trim();
    localStorage.setItem('tracker_username', myName);
    navigator.geolocation.watchPosition((pos) => {
      set(ref(db, 'locations/' + myName), {
        name: myName,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        speed: Math.round(pos.coords.speed * 3.6 || 0),
        altitude: Math.round(pos.coords.altitude || 0)
      });
    }, null, { enableHighAccuracy: true });
  });

  document.getElementById('center-btn').addEventListener('click', () => {
    if (markers[myName]) map.setView(markers[myName].getLatLng(), 16);
  });
</script>
</body>
</html>
