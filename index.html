<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב משפחתי מושלם</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; }
        #map { height: 80%; width: 100%; }
        .controls { height: 20%; padding: 10px; background: #333; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input, button { padding: 10px; margin: 5px; width: 80%; }
        button { background: #28a745; color: white; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="controls">
    <input type="text" id="username" placeholder="הכנס שם (למשל: כפיר)">
    <button id="start-btn">התחל הקלטת מסלול</button>
    <div id="status">ממתין להפעלה...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // --- כאן תדביק את המפתחות מהפרויקט שלך ---
  const firebaseConfig = {
    apiKey: "AIzaSyBR32A...",
    authDomain: "family-tracking.firebaseapp.com",
    databaseURL: "https://family-tracking.firebaseio.com",
    projectId: "family-tracking",
    storageBucket: "family-tracking.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:...",
    measurementId: "G-EJ..."
  };
  // ------------------------------------------

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const map = L.map('map').setView([31.5, 34.75], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  let markers = {};
  let polylines = {};

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = document.getElementById('username').value.trim();
    if (!name) return alert('נא להכניס שם');
    
    document.getElementById('status').innerText = "מקליט מסלול...";
    navigator.geolocation.watchPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      set(ref(db, 'users/' + name + '/last'), { lat: latitude, lng: longitude });
      push(ref(db, 'users/' + name + '/path'), { lat: latitude, lng: longitude });
    }, null, { enableHighAccuracy: true });
  });

  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    if (!users) return;
    for (const name in users) {
      if (users[name].last) {
        if (!markers[name]) markers[name] = L.marker([users[name].last.lat, users[name].last.lng]).addTo(map).bindPopup(name);
        markers[name].setLatLng([users[name].last.lat, users[name].last.lng]);
      }
      if (users[name].path) {
        const path = Object.values(users[name].path).map(p => [p.lat, p.lng]);
        if (!polylines[name]) polylines[name] = L.polyline(path, {color: 'blue'}).addTo(map);
        else polylines[name].setLatLngs(path);
      }
    }
  });
</script>
</body>
</html>
