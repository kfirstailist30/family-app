<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב משפחתי בזמן אמת</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #map { width: 100%; height: 65vh; }
    #controls { padding: 10px; height: 35vh; background: #f0f0f0; box-sizing: border-box; }
    select, button { font-size: 16px; padding: 10px; margin: 3px 0; width: 100%; border-radius: 5px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; }
    .btn-secondary { background: #007bff; }
    .btn-danger { background: #dc3545; }
  </style>
</head>
<body>

<div id="controls">
  <label for="userName">מי משתמש בטלפון הזה?</label>
  <select id="userName">
    <option value="כפיר">כפיר</option>
    <option value="מירי">מירי</option>
    <option value="רונילי">רונילי</option>
  </select>
  <button onclick="startTracking()">התחל שיתוף מיקום חי</button>
  <button class="btn-secondary" onclick="fitAllMarkers()">הצג את כולם על המפה</button>
  <button class="btn-danger" onclick="clearHistory()">איפוס היסטוריית מסלולים</button>
</div>

<div id="map"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://family-tracker-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.0461, 34.8516], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  const markers = {};
  const polylines = {};

  // צבע מסלול ייחודי לכל אחד
  const userColors = {
    "כפיר": "#007bff",
    "מירי": "#e83e8c",
    "רונילי": "#28a745"
  };

  // עדכון מיקום נוכחי וסיכות
  const usersRef = ref(db, 'locations');
  onValue(usersRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      Object.keys(data).forEach(user => {
        const { lat, lng, speed, battery, timestamp } = data[user];
        const timeAgo = Math.round((Date.now() - timestamp) / 1000);
        const speedKmh = speed ? Math.round(speed * 3.6) : 0;
        const batText = battery !== undefined ? `🔋 סוללה: ${battery}%` : '';

        const popupContent = `
          <b>${user}</b><br>
          🚗 מהירות: ${speedKmh} קמ"ש<br>
          ${batText}<br>
          ⏱️ עודכן לפני: ${timeAgo} שניות
        `;

        if (markers[user]) {
          markers[user].setLatLng([lat, lng]).setPopupContent(popupContent);
        } else {
          markers[user] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
        }
      });
    }
  });

  // ציור היסטוריית המסלולים
  const historyRef = ref(db, 'history');
  onValue(historyRef, (snapshot) => {
    const historyData = snapshot.val();
    if (historyData) {
      Object.keys(historyData).forEach(user => {
        const userHistory = historyData[user];
        const latLngs = [];

        Object.keys(userHistory).forEach(key => {
          const pt = userHistory[key];
          latLngs.push([pt.lat, pt.lng]);
        });

        const color = userColors[user] || "#ffc107";

        if (polylines[user]) {
          polylines[user].setLatLngs(latLngs);
        } else {
          polylines[user] = L.polyline(latLngs, { color: color, weight: 5, opacity: 0.8 }).addTo(map);
        }
      });
    } else {
      // אם ההיסטוריה נמחקה – מנקים מהמפה
      Object.keys(polylines).forEach(user => {
        map.removeLayer(polylines[user]);
        delete polylines[user];
      });
    }
  });

  window.fitAllMarkers = function() {
    const group = new L.featureGroup(Object.values(markers));
    if (Object.keys(markers).length > 0) {
      map.fitBounds(group.getBounds().pad(0.2));
    }
  };

  window.clearHistory = function() {
    if (confirm("האם אתה בטוח שברצונך למחוק את היסטוריית המסלולים של כולם?")) {
      remove(ref(db, 'history'));
    }
  };

  window.startTracking = async function() {
    const userName = document.getElementById('userName').value;

    let batteryLevel = 100;
    if (navigator.getBattery) {
      try {
        const battery = await navigator.getBattery();
        batteryLevel = Math.round(battery.level * 100);
      } catch (e) {}
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const speed = position.coords.speed;
        const now = Date.now();

        // עדכון מיקום נוכחי
        set(ref(db, 'locations/' + userName), {
          lat: lat,
          lng: lng,
          speed: speed,
          battery: batteryLevel,
          timestamp: now
        });

        // שמירת נקודה להיסטוריה
        push(ref(db, 'history/' + userName), {
          lat: lat,
          lng: lng,
          timestamp: now
        });

      }, (error) => {
        alert("שגיאה בקבלת מיקום: " + error.message);
      }, {
        enableHighAccuracy: true
      });
    } else {
      alert("הדפדפן שלך לא תומך במיקום GPS");
    }
  };
</script>

</body>
</html>
