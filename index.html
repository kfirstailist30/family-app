<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב בזמן אמת</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; }
        .controls { padding: 15px; background: #222; color: white; text-align: center; }
        input, select { padding: 10px; width: 70%; max-width: 300px; font-size: 16px; border-radius: 5px; border: none; text-align: center; margin-bottom: 8px; }
        button { padding: 12px 20px; width: 75%; max-width: 310px; font-size: 18px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { margin-top: 8px; font-size: 14px; color: #ddd; }
        .mode-icon { font-size: 24px; line-height: 30px; text-align: center; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <input type="text" id="username" placeholder="הכנס שם (למשל: כפיר)">
    <br>
    <select id="travel-mode">
        <option value="🚗">🚗 נסיעה במכונית</option>
        <option value="🚶">🚶 הליכה ברגל</option>
    </select>
    <br>
    <button id="start-btn">התחל הקלטת מסלול</button>
    <div id="status">ממתין להפעלה...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBR32A...", 
    authDomain: "family-tracking.firebaseapp.com",
    databaseURL: "https://family-tracking.firebaseio.com",
    projectId: "family-tracking",
    storageBucket: "family-tracking.appspot.com",
    messagingSenderId: "2483449038",
    appId: "1:2483449038:web:...",
    measurementId: "G-EJ..."
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const map = L.map('map').setView([31.5, 34.75], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  let markers = {};
  let polylines = {};
  let firstCenter = false;

  // פונקציה ליצירת אייקון מותאם (רכב או רגל)
  function createCustomIcon(symbol) {
    return L.divIcon({
      html: `<div class="mode-icon">${symbol}</div>`,
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = document.getElementById('username').value.trim();
    const mode = document.getElementById('travel-mode').value;
    if (!name) return alert('נא להכניס שם');

    document.getElementById('status').innerText = "מאתר GPS עבור " + name + "...";

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        if (!firstCenter) {
          map.setView([lat, lng], 16);
          map.invalidateSize();
          firstCenter = true;
        }

        set(ref(db, 'users/' + name + '/last'), {
          name: name,
          lat: lat,
          lng: lng,
          mode: mode,
          time: Date.now()
        });

        push(ref(db, 'users/' + name + '/path'), {
          lat: lat,
          lng: lng,
          time: Date.now()
        });

        document.getElementById('status').innerText = "מקליט מסלול בזמן אמת (" + mode + ")";
      }, (err) => {
        document.getElementById('status').innerText = "שגיאת GPS: נא לאשר מיקום בטלפון";
      }, { enableHighAccuracy: true, maximumAge: 0 });
    }
  });

  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    if (!users) return;

    Object.keys(users).forEach((userName) => {
      const userData = users[userName];

      if (userData.last && userData.last.lat && userData.last.lng) {
        const lat = userData.last.lat;
        const lng = userData.last.lng;
        const modeSymbol = userData.last.mode || '📍';

        if (markers[userName]) {
          markers[userName].setLatLng([lat, lng]);
          markers[userName].setIcon(createCustomIcon(modeSymbol));
        } else {
          markers[userName] = L.marker([lat, lng], { icon: createCustomIcon(modeSymbol) })
            .addTo(map)
            .bindPopup(userName + ' ' + modeSymbol)
            .openPopup();
        }
      }

      if (userData.path) {
        const points = Object.values(userData.path).map(p => [p.lat, p.lng]);
        if (polylines[userName]) {
          polylines[userName].setLatLngs(points);
        } else {
          polylines[userName] = L.polyline(points, { color: '#0066ff', weight: 5 }).addTo(map);
        }
      }
    });
  });
</script>

</body>
</html>
